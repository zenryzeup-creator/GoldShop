<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldShop — Kirish</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(212, 160, 23, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(212, 160, 23, 0.08) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
    }

    .box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 420px;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        0 0 100px rgba(212, 160, 23, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      position: relative;
      z-index: 1;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #d4a017, #ffd700);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(212, 160, 23, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .box h2 {
      text-align: center;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #d4a017, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .input-group {
      position: relative;
      margin-bottom: 24px;
    }

    .input-group label {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 15px;
      pointer-events: none;
      transition: all 0.3s ease;
      background: white;
      padding: 0 6px;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #d4a017;
      box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.1);
    }

    input:focus + label,
    input:not(:placeholder-shown) + label {
      top: -2px;
      font-size: 12px;
      color: #d4a017;
      font-weight: 600;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      background: linear-gradient(135deg, #d4a017, #ffd700);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(212, 160, 23, 0.3);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:hover::before {
      width: 300px;
      height: 300px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(212, 160, 23, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button span {
      position: relative;
      z-index: 1;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 13px;
    }

    /* Decorative elements */
    .decoration {
      position: absolute;
      border-radius: 50%;
      opacity: 0.6;
    }

    .decoration-1 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(212, 160, 23, 0.2), transparent);
      top: -100px;
      right: -100px;
    }

    .decoration-2 {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.15), transparent);
      bottom: -75px;
      left: -75px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    
    <div class="logo">
      <div class="logo-icon">💎</div>
      <h2>GoldShop</h2>
      <p class="subtitle">Premium do'koniga xush kelibsiz</p>
    </div>

    <div class="input-group">
      <input id="loginUser" placeholder=" " autocomplete="given-name" />
      <label>Ismingiz</label>
    </div>

    <div class="input-group">
      <input id="loginLast" placeholder=" " autocomplete="family-name" />
      <label>Familiyangiz</label>
    </div>

    <button onclick="goLogin()">
      <span>Kirish →</span>
    </button>

    <p class="footer-text">Sizning ma'lumotlaringiz xavfsiz saqlanadi 🔒</p>
  </div>

  <script>
    function goLogin() {
      const n = document.getElementById("loginUser").value.trim();
      const l = document.getElementById("loginLast").value.trim();

      if (!n || !l) {
        alert("Iltimos, barcha maydonlarni to'ldiring!");
        return;
      }

      // Store data in memory instead of localStorage
      window.authData = {
        status: "OK",
        userName: n,
        userLast: l
      };

      // In a real app, you would navigate to market.html
      // window.location.href = "market.html";
      window.location.href = "market.html";
    }

    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") goLogin();
    });
  </script>
</body>
</html>
