<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sozlamalar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #dfe9f3, #ffffff);
      padding: 24px;
      min-height: 100vh;
      transition: 0.4s;
    }

    /* DARK MODE */
    body.dark {
      background: linear-gradient(135deg, #1a202c, #2d3748);
      color: white;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease;
      transition: 0.4s;
    }

    body.dark .container {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.07);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
      font-weight: 700;
    }

    /* Profile */
    .profile-section {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
    }

    #pfp {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #a0aec0;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(66, 153, 225, 0.4);
    }

    #pfp:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(66, 153, 225, 0.7);
    }

    /* ONLINE BADGE */
    .status {
      position: absolute;
      right: 140px;
      top: 100px;
      width: 18px;
      height: 18px;
      background: #48bb78;
      border-radius: 50%;
      border: 3px solid white;
      animation: pulse 1.5s infinite;
    }

    body.dark .status {
      border: 3px solid #2d3748;
    }

    @keyframes pulse {
        0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }

      100% {
        transform: scale(1);
      }
    }

    #file {
      margin-top: 15px;
    }

    /* INPUTS */
    .input-group {
      margin-bottom: 16px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e0;
      font-size: 16px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.3);
      outline: none;
    }

    /* BUTTONS */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    #save-btn {
      background: #48bb78;
      color: white;
    }

    #save-btn:hover {
      background: #38a169;
      box-shadow: 0 0 10px rgba(56, 161, 105, 0.7);
    }

    #logout-btn {
      background: #e53e3e;
      color: white;
    }

    #logout-btn:hover {
      background: #c53030;
      box-shadow: 0 0 10px rgba(197, 48, 48, 0.7);
    }

    /* DARK MODE BUTTON */
    #theme-btn {
      margin-top: 18px;
      background: #4299e1;
      color: white;
    }

    #theme-btn:hover {
      background: #3182ce;
      box-shadow: 0 0 15px rgba(49, 130, 206, 0.7);
    }

    /* NOTIFICATION */
    #notify {
      position: fixed;
      top: 20px;
      right: -300px;
      background: #48bb78;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      transition: 0.5s;
    }

    body.dark #notify {
      background: #2f855a;
    }

    /* PREVIEW NAME */
    #previewName {
      text-align: center;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 18px;
      color: #4a5568;
    }

    body.dark #previewName {
      color: #e2e8f0;
    }
  </style>
</head>

<body>

  <div id="notify">Ma’lumotlar saqlandi! ✅</div>

  <div class="container">
    <h2>Profil Sozlamalari</h2>

    <p id="previewName"></p>

    <div class="profile-section">
      <span class="status"></span>
      <img id="pfp" alt="Profil rasmi" />
      <input type="file" id="file" accept="image/*" />
    </div>

    <div class="input-group">
      <input type="text" id="nm" placeholder="Ismingiz" onkeyup="livePreview()" />
    </div>
    <div class="input-group">
      <input type="text" id="lnm" placeholder="Familiyangiz" />
    </div>

    <button id="save-btn" onclick="save()">Saqlash</button>
    <button id="logout-btn" onclick="logout()">Chiqish</button>
    <button id="theme-btn" onclick="toggleTheme()">Dark Mode</button>

    <div class="info-section">
      <h3 style="margin-top:25px;">Biz haqimizda</h3>
      <p>GoldShop — eng qulay va zamonaviy online market. Yangi dizayn, kuchli xavfsizlik va sifatli xizmat!</p>

      <h3>Buyurtma Tarixi</h3>
      <p>Hozircha buyurtmalar yo‘q.</p>
    </div>
  </div>


  <script>
    window.onload = () => {
      document.getElementById("nm").value = localStorage.getItem("userName") || "";
      document.getElementById("lnm").value = localStorage.getItem("userLast") || "";
      document.getElementById("pfp").src = localStorage.getItem("userPhoto") || "https://via.placeholder.com/120";
      livePreview();

      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
      }
    };

    function livePreview() {
      let name = document.getElementById("nm").value.trim();
      document.getElementById("previewName").innerText = name ? "👤 " + name : "";
    }

    document.getElementById("file").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          document.getElementById("pfp").src = ev.target.result;
          localStorage.setItem("userPhoto", ev.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    function save() {
      const name = document.getElementById("nm").value.trim();
      const lastName = document.getElementById("lnm").value.trim();

      if (!name && !lastName) {
        alert("Iltimos, kamida ismingizni kiriting.");
        return;
      }

      localStorage.setItem("userName", name);
      localStorage.setItem("userLast", lastName);

      let n = document.getElementById("notify");
      n.style.right = "20px";
      setTimeout(() => {
        n.style.right = "-300px";
      }, 2000);
    }

    function logout() {
      if (confirm("Chiqishni xohlaysizmi?"))   {
        localStorage.clear();
        window.location.href = "market.html";
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }
  </script>

</body>

</html>
