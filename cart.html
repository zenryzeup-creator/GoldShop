<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Savatcha</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background: #f9f9f9;
            padding: 20px;
        }
        #content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .empty-cart svg {
            width: 60px;
            height: 60px;
            margin-bottom: 16px;
            color: #ccc;
        }
        .empty-cart h2 {
            margin: 10px 0;
            font-size: 24px;
        }
        .empty-cart p {
            color: #666;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-back {
            background: #007bff;
            color: white;
            text-decoration: none;
        }
        
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            display: flex;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .card-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .card-info {
            padding: 16px;
            flex: 1;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .card-price, .item-subtotal {
            color: #555;
            margin: 4px 0;
        }
        .card-actions {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .qty-display {
            min-width: 24px;
            text-align: center;
        }
        .remove-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .cart-summary {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .summary-row.total {
            font-weight: bold;
            font-size: 18px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }
        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkout-btn:hover {
             background: #1e7e34;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #clearBtn {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #clearBtn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Savatcha (<span id="itemCount"></span>)</h1>
    <button id="clearBtn" onclick="clearCart()" style="display: none;">Tozalash</button>
</div>

<div id="content"></div>

<script>
    let allProducts = [];
    let cartData = {};

    function goBack() {
        window.location.href = "market.html";
    }

    async function loadCart() {
        // cartData ni localStorage dan yuklash
        cartData = JSON.parse(localStorage.getItem('cartData') || '{}');
        
        const productIds = Object.keys(cartData).map(id => parseInt(id));
        
        if (productIds.length === 0) {
            showEmptyCart();
            return;
        }

        try {
            const response = await fetch("https://fakestoreapi.com/products");
            if (!response.ok) throw new Error("Ma'lumotlar yuklanmadi");
            allProducts = await response.json();

            renderCart();
        } catch (e) {
            console.error("API ishlamadi, mock ma'lumotlar yuklanmoqda:", e);
            allProducts = [
                {id:1,title:"Premium Wireless Headphones",price:299,images:["https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"]},
                {id:2,title:"Smart Watch Pro",price:399,images:["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"]},
                {id:3,title:"Modern Backpack",price:89,images:["https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"]},
                {id:4,title:"Leather Wallet",price:59,images:["https://images.unsplash.com/photo-1627123424574-724758594e93?w=400"]},
                {id:5,title:"Running Shoes",price:129,images:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"]},
                {id:6,title:"Coffee Maker Deluxe",price:159,images:["https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=400"]},
                {id:7,title:"Bluetooth Speaker",price:79,images:["https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400"]},
                {id:8,title:"Gaming Mouse",price:49,images:["https://images.unsplash.com/photo-1527814050087-3793815479db?w=400"]}
            ];
            renderCart();
        }
    }

    function showEmptyCart() {
        document.getElementById('content').innerHTML = `
            <div class="empty-cart">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
                <h2>Savatcha bo'sh</h2>
                <p>Hali hech narsa qo'shilmagan. Do'kondan mahsulot tanlang!</p>
                <button class="btn btn-back" onclick="goBack()">Do'konni ko'rish</button>
            </div>
        `;
        document.getElementById('clearBtn').style.display = 'none';
        document.getElementById('itemCount').textContent = 0;
    }

    function renderCart() {
        const productIds = Object.keys(cartData).map(id => parseInt(id));
        
        if (productIds.length === 0) {
            showEmptyCart();
            return;
        }

        document.getElementById('clearBtn').style.display = 'block';
        
        // Jami mahsulotlar sonini hisoblash
        const totalItems = Object.values(cartData).reduce((sum, qty) => sum + qty, 0);
        document.getElementById('itemCount').textContent = totalItems;

        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML = '';
        const itemsDiv = document.createElement('div');
        itemsDiv.className = 'cart-items';

        productIds.forEach(productId => {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            const qty = cartData[productId];
            const imgSrc = product.image || product.images?.[0] || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400';
            const subtotal = (product.price * qty).toFixed(2);

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img class="card-img" src="${imgSrc}" alt="${product.title}" 
                    onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400'" />
                <div class="card-info">
                    <div class="card-title">${product.title}</div>
                    <div class="card-price">$${product.price}</div>
                    <div class="item-subtotal">Jami: $${subtotal}</div>
                    <div class="card-actions">
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="changeQuantity(${productId}, -1)">−</button>
                            <span class="qty-display" id="qty-${productId}">${qty}</span>
                            <button class="qty-btn" onclick="changeQuantity(${productId}, 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${productId})">
                            🗑️ O'chirish
                        </button>
                    </div>
                </div>
            `;
            itemsDiv.appendChild(card);
        });

        contentDiv.appendChild(itemsDiv);
        renderSummary();
    }

    function renderSummary() {
        const productIds = Object.keys(cartData).map(id => parseInt(id));
        
        let subtotal = 0;
        productIds.forEach(id => {
            const product = allProducts.find(p => p.id === id);
            if (product) {
                subtotal += product.price * cartData[id];
            }
        });

        const tax = subtotal * 0.1;
        const shipping = subtotal > 0 ? 15 : 0;
        const total = subtotal + tax + shipping;

        const summaryDiv = document.createElement('div');
        summaryDiv.className = 'cart-summary';
        summaryDiv.innerHTML = `
            <div class="summary-row">
                <span>Mahsulotlar:</span>
                <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div class="summary-row">
                <span>Soliq (10%):</span>
                <span>$${tax.toFixed(2)}</span>
            </div>
            <div class="summary-row">
                <span>Yetkazib berish:</span>
                <span>$${shipping.toFixed(2)}</span>
            </div>
            <div class="summary-row total">
                <span>Jami:</span>
                <span>$${total.toFixed(2)}</span>
            </div>
            <button class="checkout-btn" onclick="window.location.href='zakaz.html'">
                🛒 Sotib olish
            </button>
        `;
        document.getElementById('content').appendChild(summaryDiv);
    }

    function changeQuantity(id, delta) {
        cartData[id] = Math.max(1, Math.min(99, cartData[id] + delta));
        localStorage.setItem('cartData', JSON.stringify(cartData));
        
        // Faqat tegishli elementlarni yangilash
        document.getElementById(`qty-${id}`).textContent = cartData[id];
        
        const product = allProducts.find(p => p.id === id);
        if (product) {
            const card = document.getElementById(`qty-${id}`).closest('.card');
            if (card) {
                card.querySelector('.item-subtotal').textContent = `Jami: $${(product.price * cartData[id]).toFixed(2)}`;
            }
        }
        
        // Jami sonni yangilash
        const totalItems = Object.values(cartData).reduce((sum, qty) => sum + qty, 0);
        document.getElementById('itemCount').textContent = totalItems;
        
        // Summary ni yangilash
        const summaryDiv = document.querySelector('.cart-summary');
        if (summaryDiv) {
            summaryDiv.remove();
        }
        renderSummary();
    }

    function removeItem(id) {
        if (confirm("Bu mahsulotni o'chirishni xohlaysizmi?")) {
            delete cartData[id];
            localStorage.setItem('cartData', JSON.stringify(cartData));
            
            if (Object.keys(cartData).length === 0) {
                showEmptyCart();
            } else {
                renderCart();
            }
        }
    }

    function clearCart() {
        if (confirm("Savatchani butunlay tozalashni xohlaysizmi?")) {
            cartData = {};
            localStorage.setItem('cartData', JSON.stringify(cartData));
            showEmptyCart();
        }
    }

    loadCart();
</script>

</body>
</html>
